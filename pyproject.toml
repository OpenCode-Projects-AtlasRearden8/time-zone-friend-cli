[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-zone-friend"
version = "0.1.0"
description = "Offline, DST-correct CLI for scheduling calls across time zones (pure stdlib)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["timezones", "scheduling", "dst", "meeting", "ics", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Conferencing",
]

[project.urls]
Homepage = "https://dylanasdale.github.io"

[project.scripts]
tzfriend = "tzfriend.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["tzfriend"]

[tool.setuptools.package-data]
tzfriend = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
